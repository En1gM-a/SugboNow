version: 2

# Quiet schedule: one grouped PR per directory per month, at most 2 open PRs
# each. This keeps lock-file conflicts with feature PRs rare. Urgent
# vulnerability fixes still arrive immediately through Dependabot security
# updates (a repository setting, separate from this file).
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      root-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
