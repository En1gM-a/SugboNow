name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Least privilege: the workflow token can only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: the job names "frontend" and "backend" are the required status checks
# in .github/rulesets/protect-main.json. If you rename a job, update the ruleset too.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request this checks out GitHub's merge commit, whose
          # first parent (HEAD^1) is the tip of the base branch. Two commits
          # of history are enough to list the files this PR changes.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Check formatting of the files this PR changes
        if: github.event_name == 'pull_request'
        run: ../scripts/ci/changed-files.sh | xargs -0 -r npx prettier --check --ignore-unknown --
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Check formatting of the files this PR changes
        if: github.event_name == 'pull_request'
        run: ../scripts/ci/changed-files.sh | xargs -0 -r npx prettier --check --ignore-unknown --
      - run: npm run build
      - run: npm test
